name: Build

on:
  push:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
  pull_request:
    types:
      - opened
  schedule:
    - cron: "0 0 * * 0" # weekly at sunday night

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: pacman -Syyu --noconfirm && pacman -S --noconfirm base-devel archiso jq grub rust pkgconf gtk4

      - name: Test easy-language-config
        run: cargo test --release --locked --manifest-path easy-language-config/Cargo.toml

      - name: Build easy-language-config
        run: cargo build --release --locked --manifest-path easy-language-config/Cargo.toml

      - name: Install easy-language-config into airootfs
        run: install -Dm755 easy-language-config/target/release/easy-language-config airootfs/usr/local/bin/easy-language-config

      - name: Build iso file
        run: mkarchiso -v .

      - name: Rename file
        if: github.ref == 'refs/heads/main'
        run: mv out/*.iso out/platter-engineer.iso

      - name: Upload iso
        if: github.ref == 'refs/heads/main'
        run: |
          bash .github/scripts/upload-asset-to-release.sh \
            ${{ secrets.RELEASE_TOKEN }} \
            "out/platter-engineer.iso" \
            "platter-engineer.iso"
